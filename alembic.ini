[alembic]
script_location = migrations
prepend_sys_path = .

# A URL do banco vem de services/config.py (variável de ambiente PN_BANCO),
# para não existir caminho de banco escrito em arquivo de configuração.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = simples

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = simples

[formatter_simples]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
